# Agent memory: mem0 v2.2.1 REST server + dashboard, with our MCP wrapper in ./mcp.
# Dashboard: https://${MEMORY_SUBDOMAIN:-memory}.${BASE_DOMAIN}
# mem0 API:  https://${MEMAPI_SUBDOMAIN:-memapi}.${BASE_DOMAIN}   (both via edge-proxy)
# MCP: http://<UBUNTU_IP>:8080/memory/mcp (via mcp-proxy)
# All secrets come from ~/mcp-secrets/memory.env on the server (see LAB_GUIDE.md Appendix 3.8).
# BASE_DOMAIN, MEMORY_SUBDOMAIN, MEMAPI_SUBDOMAIN, MEM0_GATEWAY_URL, MEM0_DEFAULT_LLM_MODEL,
# MEM0_DEFAULT_EMBEDDER_MODEL and MEM0_EMBEDDING_DIMS come from mcp-hub/.env (written by
# install.sh), not ~/mcp-secrets/ (none of these are secrets). Neither model var has a sensible
# universal default — each must be a model string YOUR OWN AI Gateway actually recognizes
# (plain model name, or @<your-provider-alias>/<model> if your gateway uses provider routing).
# A value that only existed on a different gateway instance gets rejected outright ("Provider
# rejected the request as malformed"), confirmed live — don't hardcode one here again. The two
# are SEPARATE on purpose: MEM0_DEFAULT_LLM_MODEL must be a chat/generative model (fact
# extraction), MEM0_DEFAULT_EMBEDDER_MODEL must be embedding-capable — mem0 reuses the LLM
# model for embedding calls too if this one is left unset, which fails outright ("is not
# supported in the embedContent API") against a chat-only model, also confirmed live.
#
# MEM0_EMBEDDING_DIMS (optional, defaults to 1536, OpenAI's standard) only matters as the
# BOOT-TIME starting point, patched into main.py's DEFAULT_CONFIG at build time below — mem0's
# own DEFAULT_CONFIG never sets this for the pgvector store otherwise, so PGVectorConfig's own
# hardcoded default (1536) would silently win regardless of what embedding model is actually
# configured. From then on, a SECOND patch below keeps it correct automatically: whenever the
# dashboard's Configure page changes the embedder model, main.py probes the newly-selected
# model for its REAL output size (an actual embedding call, not a hardcoded name->dims table —
# works for any bundled provider/model) and, if it differs from what's on file, drops the
# `memories` table (old vectors can't be reused across a model change anyway) so it gets
# recreated with the right dimension on next use. This is what makes switching to a
# non-1536-dim embedder (e.g. Vertex AI's 768-dim text-embedding-005) in the dashboard just
# work, with no manual `MEM0_EMBEDDING_DIMS` edit or DROP TABLE needed — see LAB_GUIDE.md
# Appendix 3.8 for the manual fallback if the auto-probe ever can't run (e.g. gateway briefly
# unreachable at the moment you save the new model).

services:
  memory-mcp:
    build: ./mcp
    image: mcp-hub/memory-mcp:0.1.0
    container_name: memory-mcp
    env_file: ${HOME}/mcp-secrets/memory.env   # ADMIN_API_KEY
    environment:
      MEM0_API_URL: http://memory-api:8000
    depends_on:
      memory-api: {condition: service_healthy}
    networks: [default, memory]
    restart: unless-stopped
    # No ports: reachable only through mcp-proxy on the Docker network.

  memory-api:
    build:
      context: https://github.com/mem0ai/mem0.git#v2.2.1:server
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.7
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt mem0ai==2.2.1
        COPY . .
        # See the header comment above (MEM0_EMBEDDING_DIMS) for why this patch exists: mem0's
        # own DEFAULT_CONFIG never sets embedding_model_dims for pgvector, so it silently
        # assumes OpenAI's 1536 regardless of the actual configured embedder.
        RUN sed -i 's/"collection_name": POSTGRES_COLLECTION_NAME,/"collection_name": POSTGRES_COLLECTION_NAME, "embedding_model_dims": int(os.environ.get("MEM0_EMBEDDING_DIMS", "1536")),/' main.py
        # Second patch: keep embedding_model_dims correct automatically from then on, not just
        # at boot. Wraps POST /configure so that whenever the embedder config changes, it probes
        # the newly-selected model for its real output size and recreates the `memories` table
        # if that differs from what's on file. Fails the build loudly (anchor not found) if
        # mem0's main.py ever changes shape upstream, rather than silently skipping the patch.
        RUN <<'PYEOF'
        #!/usr/bin/env python3
        path = "main.py"
        src = open(path).read()

        anchor = '''@app.post("/configure", summary="Configure Mem0")
        def set_config(config: Dict[str, Any], _auth=Depends(require_admin)):
            """Set memory configuration. Requires admin role."""
            _validate_bundled_providers(config)
            update_config(config)
            return {"message": "Configuration set successfully"}'''

        replacement = '''def _recreate_vector_table() -> None:
            """Drop the pgvector collection so Memory.from_config's CREATE TABLE IF NOT EXISTS
            recreates it with the new embedding_model_dims -- changing that setting alone never
            alters an existing column's declared vector size."""
            import psycopg
            from psycopg import sql

            with psycopg.connect(
                host=POSTGRES_HOST, port=int(POSTGRES_PORT), dbname=POSTGRES_DB,
                user=POSTGRES_USER, password=POSTGRES_PASSWORD, autocommit=True,
            ) as conn:
                with conn.cursor() as cur:
                    cur.execute(sql.SQL("DROP TABLE IF EXISTS {}").format(sql.Identifier(POSTGRES_COLLECTION_NAME)))


        def _autodetect_embedding_dims(config: Dict[str, Any]) -> Dict[str, Any]:
            """Whenever the embedder config changes (e.g. switching models in the dashboard),
            probe the REAL model for its output size instead of trusting whatever dimension is
            already on file -- mem0's own DEFAULT_CONFIG only sets embedding_model_dims once, at
            boot, and never revisits it, so a model switch silently breaks every future insert
            ("expected N dimensions, not M") until the table is fixed by hand. Recreates the
            vector table (old vectors can't be reused across a model change anyway) when the
            probed size doesn't match what's on file."""
            if "embedder" not in config:
                return config

            from copy import deepcopy
            from server_state import _merge_config

            current = get_current_config()
            merged_embedder = _merge_config(current.get("embedder", {}), config["embedder"])

            try:
                from mem0.utils.factory import EmbedderFactory
                probe = EmbedderFactory.create(merged_embedder["provider"], merged_embedder.get("config", {}), None)
                dims = len(probe.embed("dimension probe"))
            except Exception:
                logging.warning(
                    "Could not auto-detect the new embedder's dimension -- leaving the vector store config untouched.",
                    exc_info=True,
                )
                return config

            current_dims = current.get("vector_store", {}).get("config", {}).get("embedding_model_dims")
            if dims == current_dims:
                return config

            logging.info(
                "Embedder dimension changed (%s -> %s); recreating the '%s' vector table.",
                current_dims, dims, POSTGRES_COLLECTION_NAME,
            )
            _recreate_vector_table()

            config = deepcopy(config)
            config.setdefault("vector_store", {}).setdefault("config", {})["embedding_model_dims"] = dims
            return config


        @app.post("/configure", summary="Configure Mem0")
        def set_config(config: Dict[str, Any], _auth=Depends(require_admin)):
            """Set memory configuration. Requires admin role."""
            _validate_bundled_providers(config)
            config = _autodetect_embedding_dims(config)
            update_config(config)
            return {"message": "Configuration set successfully"}'''

        if anchor not in src:
            raise SystemExit("ERROR: /configure anchor not found in main.py -- mem0 server source may have changed upstream.")

        src = src.replace(anchor, replacement, 1)
        open(path, "w").write(src)
        print("Patched main.py: auto-detect embedding dimensions on /configure.")
        PYEOF
        ENV PYTHONUNBUFFERED=1
        CMD ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    image: mcp-hub/memory-api:2.2.1
    container_name: memory-api
    env_file: ${HOME}/mcp-secrets/memory.env   # POSTGRES_*, JWT_SECRET, ADMIN_API_KEY, OPENAI_API_KEY (gateway key)
    environment:
      POSTGRES_HOST: memory-postgres
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_BASE_URL: ${MEM0_GATEWAY_URL}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-1536}
      DASHBOARD_URL: https://${MEMORY_SUBDOMAIN:-memory}.${BASE_DOMAIN}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
    volumes:
      - memory_history:/app/history
    ports:
      - "127.0.0.1:8083:8000"          # the dashboard's browser code calls this API directly,
                                        # via https://${MEMAPI_SUBDOMAIN:-memapi}.${BASE_DOMAIN} fronted by edge-proxy
    depends_on:
      memory-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [memory]
    restart: unless-stopped

  memory-dashboard:
    build: https://github.com/mem0ai/mem0.git#v2.2.1:server/dashboard
    image: mcp-hub/memory-dashboard:2.2.1
    container_name: memory-dashboard
    environment:
      NEXT_PUBLIC_API_URL: https://${MEMAPI_SUBDOMAIN:-memapi}.${BASE_DOMAIN}
      API_INTERNAL_URL: http://memory-api:8000
      NEXT_PUBLIC_INSTANCE_NAME: Agent Memory
      DASHBOARD_URL: https://${MEMORY_SUBDOMAIN:-memory}.${BASE_DOMAIN}   # https:// here is required for the login cookie to be Secure, now that edge-proxy terminates TLS
    ports:
      - "127.0.0.1:8082:3000"
    depends_on:
      - memory-api
    networks: [memory]
    restart: unless-stopped

  memory-postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: memory-postgres
    env_file: ${HOME}/mcp-secrets/memory.env   # POSTGRES_USER / POSTGRES_PASSWORD
    shm_size: 128mb
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [memory]
    restart: unless-stopped

networks:
  memory: {}

volumes:
  memory_pgdata: {}
  memory_history: {}
