<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chroma Knowledge Base{% endblock %}</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h1 a { color: inherit; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e0e0e0; }
  form.inline { display: inline; }
  input[type=text], input[type=file] { padding: 0.4rem; }
  button { padding: 0.4rem 0.9rem; cursor: pointer; }
  button.danger { background: #c0392b; color: white; border: none; border-radius: 4px; }
  .muted { color: #777; font-size: 0.9rem; }
  .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .snippet { color: #444; font-size: 0.9rem; }
  nav { margin-bottom: 1.5rem; }
</style>
</head>
<body>
<nav><h1><a href="/">Chroma Knowledge Base</a></h1></nav>
{% block content %}{% endblock %}
</body>
</html>
