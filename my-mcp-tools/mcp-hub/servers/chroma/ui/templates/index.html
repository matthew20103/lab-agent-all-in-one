{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>New collection</h2>
  <form method="post" action="/collections">
    <input type="text" name="name" placeholder="collection name" required>
    <button type="submit">Create</button>
  </form>
</div>

<h2>Collections</h2>
{% if collections %}
<table>
  <tr><th>Name</th><th>Documents</th><th></th></tr>
  {% for c in collections %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.count }}</td>
    <td><a href="/collections/{{ c.name }}">Open</a></td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="muted">No collections yet — create one above.</p>
{% endif %}
{% endblock %}
