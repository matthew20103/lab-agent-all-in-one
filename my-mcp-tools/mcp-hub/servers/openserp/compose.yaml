services:
  openserp:
    image: karust/openserp:latest
    container_name: openserp
    init: true
    shm_size: 2gb                      # Chrome crashes with the default 64MB /dev/shm
    command: serve -l
    environment:
      OPENSERP_SERVER_HOST: "0.0.0.0"
      OPENSERP_SERVER_PORT: 7000
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml:ro
    ports:
      - "127.0.0.1:7000:7000"          # localhost only, for debugging the REST API
    restart: unless-stopped

  openserp-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: mcp-hub/openserp-mcp:0.1.7
    container_name: openserp-mcp
    environment:
      OPENSERP_BASE_URL: "http://openserp:7000"
      OPENSERP_BACKEND: "oss"
      OPENSERP_TIMEOUT_MS: "60000"
    depends_on:
      - openserp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # No ports: reachable only through mcp-proxy on the Docker network.
